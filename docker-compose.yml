services:
  voiceforge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-80}:8000"
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-v3}
      DEVICE: ${DEVICE:-auto}
      MAX_WORDS: ${MAX_WORDS:-10000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_CHUNK_CHARS: ${MAX_CHUNK_CHARS:-700}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OUTPUT_BITRATE: ${OUTPUT_BITRATE:-192k}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./data:/app/data
      - voiceforge_model_cache:/root/.cache/huggingface
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  voiceforge_model_cache:
